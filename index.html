<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld - Aesthetic E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f3ec; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .text-dark-coffee { color: #3e2b26; }
        .btn-coffee { background-color: #3e2b26; color: #fff; }
        .btn-coffee:hover { background-color: #241714; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-[#e8dfd1] border-b border-[#ded3c3] py-4 px-6 flex justify-between items-center shadow-xs sticky top-0 z-40">
        <h1 class="text-xl font-bold font-cinzel text-dark-coffee tracking-wider">Underworld</h1>
        
        <div class="flex items-center gap-3">
            <!-- Secret Admin Button (Hidden by default unless #admin is in URL) -->
            <button id="secret-admin-btn" onclick="openAdminLogin()" class="hidden text-xs bg-[#3e2b26] text-white px-3 py-1.5 rounded-full font-bold shadow hover:opacity-90 transition">
                <i class="fas fa-lock"></i> Admin Panel
            </button>
        </div>
    </header>

    <!-- Main Storefront -->
    <main class="container mx-auto p-4 md:p-6 space-y-8">
        <!-- Hero Section -->
        <div class="text-center py-10 bg-white rounded-3xl border border-[#e5dcce] shadow-xs p-6">
            <h2 class="text-3xl font-bold font-cinzel text-dark-coffee mb-2">Welcome to Underworld</h2>
            <p class="text-gray-500 text-sm max-w-md mx-auto">Explore our exclusive collections. Premium quality products delivered right to your doorstep.</p>
        </div>

        <!-- Products Grid -->
        <div>
            <h3 class="text-lg font-bold font-cinzel text-dark-coffee mb-4 border-b border-[#e5dcce] pb-2">All Products</h3>
            <div id="store-products" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Products will load dynamically from Firebase -->
                <p class="col-span-full text-center text-gray-400 text-xs py-10">Loading products...</p>
            </div>
        </div>
    </main>

    <!-- Secret Admin Modal (Hidden by default) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl w-full max-w-lg border border-[#e5dcce] shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdmin()" class="absolute top-4 right-4 text-gray-400 hover:text-black font-bold text-lg"><i class="fas fa-times"></i></button>
            
            <!-- Login View -->
            <div id="admin-login-box">
                <h3 class="text-xl font-bold font-cinzel text-dark-coffee mb-4 text-center">Admin Login</h3>
                <form onsubmit="verifyAdmin(event)" class="space-y-3">
                    <input type="password" id="admin-pass-input" placeholder="Enter Password (admin123)" required class="w-full bg-[#fdfbf9] border border-[#dcd1c2] p-3 rounded-2xl text-sm outline-none focus:border-[#3e2b26]">
                    <button type="submit" class="w-full btn-coffee font-bold py-3 rounded-2xl text-sm shadow">Login</button>
                </form>
            </div>

            <!-- Dashboard View -->
            <div id="admin-dashboard-box" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="text-lg font-bold font-cinzel text-dark-coffee">Admin Dashboard</h3>
                    <button onclick="logoutAdmin()" class="text-xs text-red-500 font-bold hover:underline">Logout</button>
                </div>

                <!-- Add Product Form -->
                <form onsubmit="addNewProduct(event)" class="space-y-3 text-xs bg-[#fdfbf9] p-4 rounded-2xl border border-[#e5dcce]">
                    <h4 class="font-bold text-dark-coffee text-sm mb-2"><i class="fas fa-plus-circle"></i> Add New Product</h4>
                    <div>
                        <label class="block font-semibold mb-1">Product Title</label>
                        <input type="text" id="p-title" required class="w-full border border-[#dcd1c2] p-2.5 rounded-xl bg-white outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Price (৳)</label>
                        <input type="number" id="p-price" required class="w-full border border-[#dcd1c2] p-2.5 rounded-xl bg-white outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Direct Image URL</label>
                        <input type="text" id="p-img" placeholder="https://..." required class="w-full border border-[#dcd1c2] p-2.5 rounded-xl bg-white outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Category</label>
                        <select id="p-cat" class="w-full border border-[#dcd1c2] p-2.5 rounded-xl bg-white outline-none">
                            <option value="mens_fashion">Men's fashion</option>
                            <option value="womans_fashion">Woman's fashion</option>
                            <option value="smartwatch">Smartwatch</option>
                            <option value="gift_combo">Gift combo</option>
                            <option value="shoes">Shoes</option>
                            <option value="airpods">Airpods</option>
                            <option value="power_bank">Power bank</option>
                            <option value="electricity">Electricity</option>
                            <option value="phone">Phone</option>
                            <option value="skin_care">Skin care</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full btn-coffee font-bold py-2.5 rounded-xl shadow">Save Product</button>
                </form>

                <!-- Product List -->
                <div>
                    <h4 class="font-bold text-dark-coffee mb-2 text-xs">Manage Existing Products</h4>
                    <div id="admin-product-list" class="space-y-2 max-h-44 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqvllCwLU_c_jcMm7kGtFcfjacqfbv8XE",
            authDomain: "hisab-ghor-ab9df.firebaseapp.com",
            projectId: "hisab-ghor-ab9df",
            storageBucket: "hisab-ghor-ab9df.firebasestorage.app",
            messagingSenderId: "704142339855",
            appId: "1:704142339855:web:331d04ae8da79172a2d87a",
            measurementId: "G-NRV7MVKJHT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Secret Admin Trigger via URL Hash (#admin)
        if(window.location.hash === "#admin") {
            document.getElementById('secret-admin-btn').classList.remove('hidden');
        }

        window.openAdminLogin = () => {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-modal').classList.add('flex');
        };

        window.closeAdmin = () => {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-modal').classList.remove('flex');
        };

        window.verifyAdmin = (e) => {
            e.preventDefault();
            if(document.getElementById('admin-pass-input').value === "admin123") {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard-box').classList.remove('hidden');
                loadAdminProducts();
            } else {
                alert('Wrong Password!');
            }
        };

        window.logoutAdmin = () => {
            document.getElementById('admin-login-box').classList.remove('hidden');
            document.getElementById('admin-dashboard-box').classList.add('hidden');
            document.getElementById('admin-pass-input').value = '';
        };

        window.addNewProduct = async (e) => {
            e.preventDefault();
            const product = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-cat').value
            };
            await addDoc(collection(db, "products"), product);
            alert('Product Added Successfully!');
            e.target.reset();
            loadAdminProducts();
            loadStoreProducts();
        };

        async function loadAdminProducts() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '<p class="text-gray-400 text-xs">Loading...</p>';
            const snap = await getDocs(collection(db, "products"));
            list.innerHTML = '';
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-white border border-[#e5dcce] p-2 rounded-xl text-xs">
                        <div class="flex items-center gap-2 truncate">
                            <img src="${p.img}" class="w-8 h-8 object-cover rounded-lg bg-gray-100">
                            <span class="truncate font-semibold">${p.title}</span>
                        </div>
                        <span class="text-dark-coffee font-bold">৳${p.price}</span>
                        <button onclick="deleteProd('${d.id}')" class="text-red-500 hover:text-red-700 font-bold px-2"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        window.deleteProd = async (id) => {
            if(confirm('Are you sure to delete this product?')) {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
                loadStoreProducts();
            }
        };

        async function loadStoreProducts() {
            const grid = document.getElementById('store-products');
            const snap = await getDocs(collection(db, "products"));
            grid.innerHTML = '';
            if(snap.empty) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-400 text-xs py-10">No products available right now.</p>';
                return;
            }
            snap.forEach(d => {
                const p = d.data();
                grid.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl border border-[#e5dcce] shadow-xs flex flex-col justify-between">
                        <div>
                            <img src="${p.img}" class="w-full h-36 object-cover rounded-xl bg-gray-100 mb-2">
                            <h3 class="font-bold text-xs text-gray-800 line-clamp-1">${p.title}</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 uppercase">${p.category.replace('_', ' ')}</p>
                        </div>
                        <div class="mt-3 flex items-center justify-between">
                            <span class="text-dark-coffee font-black text-sm">৳${p.price}</span>
                            <span class="text-[10px] bg-[#f7f3ec] text-dark-coffee px-2 py-1 rounded-lg font-bold">Available</span>
                        </div>
                    </div>
                `;
            });
        }

        loadStoreProducts();
    </script>
</body>
</html>
