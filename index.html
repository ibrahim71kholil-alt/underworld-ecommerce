<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld - Premium Online Store</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-16">

    <!-- Top Navigation -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center gap-4">
            
            <!-- Unique Brand Logo & Name -->
            <div onclick="showHomePage()" class="flex items-center gap-2 cursor-pointer select-none">
                <div class="w-9 h-9 bg-gradient-to-tr from-red-700 to-red-500 rounded-lg flex items-center justify-center shadow-md transform hover:rotate-6 transition">
                    <i class="fas fa-crown text-white text-lg"></i>
                </div>
                <span class="text-xl md:text-2xl font-black tracking-widest text-white">UNDER<span class="text-red-500">WORLD</span></span>
            </div>

            <!-- Search Bar (Desktop) -->
            <div class="hidden md:flex flex-1 max-w-md relative">
                <input type="text" id="desktop-search" oninput="handleSearch(this.value)" placeholder="Search products..." class="w-full bg-zinc-900 border border-zinc-700 rounded-full py-1.5 pl-10 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-red-500">
                <i class="fas fa-search absolute left-3.5 top-2.5 text-gray-400 text-xs"></i>
            </div>

            <!-- Language & Cart -->
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="lang-btn" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-bold px-3 py-1.5 rounded-full border border-zinc-700 transition text-gray-200">
                    বাংলা
                </button>

                <button onclick="toggleCart()" class="relative p-2 bg-zinc-800 rounded-full hover:bg-zinc-700 transition">
                    <i class="fas fa-shopping-bag text-gray-200"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>

        <!-- Search Bar (Mobile) -->
        <div class="px-4 pb-3 md:hidden">
            <div class="relative w-full">
                <input type="text" id="mobile-search" oninput="handleSearch(this.value)" placeholder="Search products..." class="w-full bg-zinc-900 border border-zinc-700 rounded-full py-1.5 pl-9 pr-4 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-red-500">
                <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-[10px]"></i>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="bg-gradient-to-r from-zinc-900 via-black to-zinc-900 text-white py-8 px-4 text-center border-b border-zinc-800">
        <h2 id="hero-title" class="text-2xl md:text-4xl font-extrabold mb-1 tracking-wide">Premium Collection</h2>
        <p id="hero-subtitle" class="text-gray-400 text-xs md:text-sm">Find your desired lifestyle, fashion & technology gear</p>
    </div>

    <!-- Category Nav Bar -->
    <div class="bg-white shadow-sm sticky top-[60px] md:top-[65px] z-40">
        <div class="container mx-auto px-4 py-2.5 flex overflow-x-auto gap-2 scrollbar-hide" id="category-bar"></div>
    </div>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6">
        <!-- Home Category View -->
        <div id="home-view" class="space-y-8"></div>

        <!-- Single Category View -->
        <div id="category-view" class="hidden">
            <div class="flex justify-between items-center mb-6 pb-2 border-b">
                <h3 id="cat-view-title" class="text-xl font-bold"></h3>
                <button onclick="showHomePage()" class="text-xs md:text-sm text-red-600 font-bold flex items-center gap-1">
                    <i class="fas fa-arrow-left"></i> <span id="back-home-txt">Back to Home</span>
                </button>
            </div>
            <div id="cat-view-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="cart-drawer-title" class="text-lg font-bold">Shopping Cart</h3>
                <button onclick="toggleCart()" class="text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="flex-1 space-y-3"></div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span id="total-txt">Total:</span>
                    <span class="text-red-600">৳<span id="cart-total">0</span></span>
                </div>
                <button onclick="showCheckout()" id="checkout-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-bold">Confirm Order</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-2xl">
            <h3 id="form-title" class="text-xl font-bold mb-3">Cash On Delivery Order</h3>
            <form onsubmit="submitOrder(event)" class="space-y-3">
                <input type="text" id="cust-name" placeholder="Full Name" required class="w-full border p-2.5 rounded text-sm outline-none focus:border-black">
                <input type="tel" id="cust-phone" placeholder="Phone Number" required class="w-full border p-2.5 rounded text-sm outline-none focus:border-black">
                <textarea id="cust-address" placeholder="Delivery Address (District, Police Station, Area)" required class="w-full border p-2.5 rounded text-sm outline-none focus:border-black" rows="3"></textarea>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeCheckout()" id="cancel-btn" class="px-4 py-2 bg-gray-200 rounded text-sm">Cancel</button>
                    <button type="submit" id="place-order-btn" class="px-4 py-2 bg-red-600 text-white rounded text-sm font-bold">Place Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 আপনার Firebase Keys এখানে বসান
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = 'en'; // ডিফল্ট ইংলিশ
        let allProducts = [];
        let cart = [];

        const categories = [
            { id: 'mens_fashion', en: "Men's fashion", bn: "ছেলেদের ফ্যাশন" },
            { id: 'womans_fashion', en: "Woman's fashion", bn: "মেয়েদের ফ্যাশন" },
            { id: 'smartwatch', en: "Smartwatch", bn: "স্মার্টওয়াচ" },
            { id: 'gift_combo', en: "Gift combo", bn: "গিফট কম্বো" },
            { id: 'shoes', en: "Shoes", bn: "জুতা" },
            { id: 'airpods', en: "Airpods", bn: "এয়ারপডস" },
            { id: 'power_bank', en: "Power bank", bn: "পাওয়ার ব্যাংক" },
            { id: 'electricity', en: "Electricity", bn: "ইলেকট্রিসিটি" },
            { id: 'phone', en: "Phone", bn: "ফোন" },
            { id: 'skin_care', en: "Skin care", bn: "স্কিন কেয়ার" }
        ];

        const i18n = {
            en: {
                heroTitle: "Premium Collection",
                heroSubtitle: "Find your desired lifestyle, fashion & technology gear",
                all: "All",
                viewAll: "View All",
                addCart: "Add to Bag",
                cartTitle: "Shopping Cart",
                total: "Total:",
                confirmOrder: "Confirm Order",
                checkoutTitle: "Cash On Delivery Order",
                namePh: "Full Name",
                phonePh: "Phone Number",
                addrPh: "Delivery Address (District, Thana, Road/House)",
                cancel: "Cancel",
                placeOrder: "Place Order",
                backHome: "Back to Home",
                emptyCart: "Cart is empty!",
                addedAlert: "Added to cart successfully!",
                orderSuccess: "Thank you! Your order has been placed successfully."
            },
            bn: {
                heroTitle: "প্রিমিয়াম কালেকশন",
                heroSubtitle: "আপনার প্রয়োজনীয় ফ্যাশন, লাইফস্টাইল ও ইলেকট্রনিক্স সামগ্রী",
                all: "হোমপেজ",
                viewAll: "সব দেখুন",
                addCart: "ব্যাগে নিন",
                cartTitle: "শপিং ব্যাগ",
                total: "সর্বমোট:",
                confirmOrder: "অর্ডার কনফার্ম করুন",
                checkoutTitle: "ক্যাশ অন ডেলিভারি অর্ডার",
                namePh: "আপনার পুরো নাম",
                phonePh: "মোবাইল নম্বর",
                addrPh: "ডেলিভারি ঠিকানা (জেলা, থানা, এলাকা/রোড নং)",
                cancel: "বাতিল",
                placeOrder: "অর্ডার প্লেস করুন",
                backHome: "হোমপেজে ফিরুন",
                emptyCart: "ব্যাগ খালি!",
                addedAlert: "পণ্যটি সফলভাবে ব্যাগে যুক্ত হয়েছে!",
                orderSuccess: "ধন্যবাদ! আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।"
            }
        };

        window.toggleLanguage = function() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            document.getElementById('lang-btn').innerText = currentLang === 'en' ? 'বাংলা' : 'English';
            updateStaticText();
            renderCategoryBar();
            showHomePage();
        };

        function updateStaticText() {
            const t = i18n[currentLang];
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-subtitle').innerText = t.heroSubtitle;
            document.getElementById('cart-drawer-title').innerText = t.cartTitle;
            document.getElementById('total-txt').innerText = t.total;
            document.getElementById('checkout-btn').innerText = t.confirmOrder;
            document.getElementById('form-title').innerText = t.checkoutTitle;
            document.getElementById('cust-name').placeholder = t.namePh;
            document.getElementById('cust-phone').placeholder = t.phonePh;
            document.getElementById('cust-address').placeholder = t.addrPh;
            document.getElementById('cancel-btn').innerText = t.cancel;
            document.getElementById('place-order-btn').innerText = t.placeOrder;
            document.getElementById('back-home-txt').innerText = t.backHome;
        }

        function renderCategoryBar() {
            const bar = document.getElementById('category-bar');
            const t = i18n[currentLang];
            let html = `<button onclick="showHomePage()" class="px-3.5 py-1.5 rounded-full bg-black text-white text-xs font-semibold whitespace-nowrap">${t.all}</button>`;
            categories.forEach(c => {
                html += `<button onclick="viewFullCategory('${c.id}')" class="px-3.5 py-1.5 rounded-full bg-gray-100 hover:bg-gray-200 text-xs font-semibold whitespace-nowrap">${currentLang === 'en' ? c.en : c.bn}</button>`;
            });
            bar.innerHTML = html;
        }

        async function loadProducts() {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
            renderCategoryBar();
            showHomePage();
        }

        function getCardHTML(p) {
            const t = i18n[currentLang];
            return `
                <div class="bg-white rounded-lg border shadow-sm p-3 flex flex-col justify-between hover:shadow-md transition">
                    <img src="${p.img}" alt="${p.title}" class="h-36 sm:h-44 w-full object-cover rounded mb-2 bg-gray-50">
                    <div>
                        <h4 class="font-bold text-xs sm:text-sm line-clamp-1">${p.title}</h4>
                        <p class="text-red-600 font-extrabold text-sm sm:text-base mt-1">৳${p.price}</p>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="mt-3 bg-black hover:bg-zinc-800 text-white text-xs py-1.5 rounded font-medium">${t.addCart}</button>
                </div>
            `;
        }

        window.showHomePage = function() {
            document.getElementById('category-view').classList.add('hidden');
            const home = document.getElementById('home-view');
            home.classList.remove('hidden');
            home.innerHTML = '';
            const t = i18n[currentLang];

            categories.forEach(cat => {
                const prods = allProducts.filter(p => p.category === cat.id);
                if (prods.length === 0) return;

                const topFour = prods.slice(0, 4);
                const title = currentLang === 'en' ? cat.en : cat.bn;

                home.innerHTML += `
                    <section class="bg-white p-4 rounded-xl border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-base md:text-lg font-bold border-l-4 border-red-500 pl-2">${title}</h3>
                            <button onclick="viewFullCategory('${cat.id}')" class="text-xs font-bold text-red-600 hover:underline flex items-center gap-1">
                                ${t.viewAll} (${prods.length}) <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${topFour.map(p => getCardHTML(p)).join('')}
                        </div>
                    </section>
                `;
            });
        };

        window.viewFullCategory = function(catId) {
            document.getElementById('home-view').classList.add('hidden');
            const catView = document.getElementById('category-view');
            catView.classList.remove('hidden');

            const cat = categories.find(c => c.id === catId);
            const prods = allProducts.filter(p => p.category === catId);
            const title = currentLang === 'en' ? cat.en : cat.bn;

            document.getElementById('cat-view-title').innerText = `${title} (${prods.length})`;
            document.getElementById('cat-view-grid').innerHTML = prods.map(p => getCardHTML(p)).join('');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.handleSearch = function(query) {
            if(!query.trim()) {
                showHomePage();
                return;
            }
            document.getElementById('home-view').classList.add('hidden');
            const catView = document.getElementById('category-view');
            catView.classList.remove('hidden');

            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));
            document.getElementById('cat-view-title').innerText = `Search: "${query}" (${filtered.length})`;
            document.getElementById('cat-view-grid').innerHTML = filtered.map(p => getCardHTML(p)).join('');
        };

        window.addToCart = function(id) {
            const p = allProducts.find(item => item.id === id);
            cart.push(p);
            document.getElementById('cart-count').innerText = cart.length;
            renderCartDrawer();
            alert(i18n[currentLang].addedAlert);
        };

        window.toggleCart = () => document.getElementById('cart-modal').classList.toggle('hidden');

        function renderCartDrawer() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((p, idx) => {
                total += Number(p.price);
                container.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2 text-sm">
                        <div>
                            <p class="font-bold">${p.title}</p>
                            <p class="text-xs text-gray-500">৳${p.price}</p>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold">&times;</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total;
        }

        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            document.getElementById('cart-count').innerText = cart.length;
            renderCartDrawer();
        };

        window.showCheckout = function() {
            if(cart.length === 0) return alert(i18n[currentLang].emptyCart);
            toggleCart();
            document.getElementById('checkout-modal').classList.remove('hidden');
        };

        window.closeCheckout = () => document.getElementById('checkout-modal').classList.add('hidden');

        window.submitOrder = async function(e) {
            e.preventDefault();
            const order = {
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value,
                items: cart,
                total: document.getElementById('cart-total').innerText,
                date: new Date().toLocaleString()
            };

            await addDoc(collection(db, "orders"), order);
            alert(i18n[currentLang].orderSuccess);
            cart = [];
            document.getElementById('cart-count').innerText = 0;
            closeCheckout();
        };

        loadProducts();
    </script>
</body>
</html>
