<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld - Luxury Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf6f5;
        }
        .bg-burgundy-theme { background-color: #722f37; }
        .text-burgundy { color: #722f37; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Login Box -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-[#f0e4e2]">
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="w-10 h-10 bg-burgundy-theme text-white rounded-xl flex items-center justify-center"><i class="fas fa-lock"></i></div>
                <h2 class="text-2xl font-bold font-serif text-burgundy">ADMIN ACCESS</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter Admin Password" required class="w-full bg-[#fbf8f7] border border-[#e8d8d6] p-3 rounded-xl text-sm outline-none focus:border-[#722f37]">
                <button type="submit" class="w-full bg-burgundy-theme text-white font-bold py-3 rounded-xl text-sm shadow hover:opacity-95 transition">Login to Panel</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden min-h-screen">
        <header class="bg-white border-b border-[#f0e4e2] py-4 px-6 flex justify-between items-center shadow-xs">
            <h1 class="text-xl font-bold font-serif text-burgundy flex items-center gap-2"><i class="fas fa-shield-alt"></i> Underworld Admin</h1>
            <button onclick="logout()" class="text-xs bg-[#f0dfdc] text-burgundy hover:bg-burgundy-theme hover:text-white px-4 py-2 rounded-lg font-bold transition">Logout</button>
        </header>

        <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Product -->
            <div class="bg-white p-5 rounded-2xl border border-[#f0e4e2] shadow-sm">
                <h3 class="text-base font-bold mb-4 border-b border-[#f0e4e2] pb-2 text-burgundy"><i class="fas fa-plus-circle"></i> Add New Product</h3>
                <form onsubmit="addProduct(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold mb-1">Product Title</label>
                        <input type="text" id="p-title" required class="w-full bg-[#fbf8f7] border border-[#e8d8d6] p-2.5 rounded-xl outline-none focus:border-[#722f37]">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Price (৳)</label>
                        <input type="number" id="p-price" required class="w-full bg-[#fbf8f7] border border-[#e8d8d6] p-2.5 rounded-xl outline-none focus:border-[#722f37]">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Direct Image URL</label>
                        <input type="text" id="p-img" required class="w-full bg-[#fbf8f7] border border-[#e8d8d6] p-2.5 rounded-xl outline-none focus:border-[#722f37]" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Category</label>
                        <select id="p-cat" class="w-full bg-[#fbf8f7] border border-[#e8d8d6] p-2.5 rounded-xl outline-none focus:border-[#722f37]">
                            <option value="mens_fashion">Men's fashion</option>
                            <option value="womans_fashion">Woman's fashion</option>
                            <option value="smartwatch">Smartwatch</option>
                            <option value="gift_combo">Gift combo</option>
                            <option value="shoes">Shoes</option>
                            <option value="airpods">Airpods</option>
                            <option value="power_bank">Power bank</option>
                            <option value="electricity">Electricity</option>
                            <option value="phone">Phone</option>
                            <option value="skin_care">Skin care</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-burgundy-theme text-white font-bold py-3 rounded-xl shadow hover:opacity-95 transition">Save Product</button>
                </form>
            </div>

            <!-- Orders -->
            <div class="bg-white p-5 rounded-2xl border border-[#f0e4e2] shadow-sm">
                <h3 class="text-base font-bold mb-4 border-b border-[#f0e4e2] pb-2 text-burgundy"><i class="fas fa-shopping-bag"></i> Customer Orders</h3>
                <div id="orders-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1"></div>
            </div>

            <!-- Live Products -->
            <div class="bg-white p-5 rounded-2xl border border-[#f0e4e2] shadow-sm">
                <h3 class="text-base font-bold mb-4 border-b border-[#f0e4e2] pb-2 text-burgundy"><i class="fas fa-boxes"></i> Live Products</h3>
                <div id="products-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 আপনার Firebase Keys এখানে বসান
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASS = "admin123";

        window.handleLogin = function(e) {
            e.preventDefault();
            if(document.getElementById('admin-pass').value === ADMIN_PASS) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadAllData();
            } else {
                alert('Invalid Admin Password!');
            }
        };

        window.logout = () => location.reload();

        window.addProduct = async function(e) {
            e.preventDefault();
            const product = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-cat').value
            };
            await addDoc(collection(db, "products"), product);
            alert('Product added successfully!');
            e.target.reset();
            loadAllData();
        };

        async function loadAllData() {
            // Orders
            const orderBox = document.getElementById('orders-list');
            orderBox.innerHTML = '<p class="text-xs text-gray-500">Loading orders...</p>';
            const orderSnap = await getDocs(collection(db, "orders"));
            orderBox.innerHTML = '';
            orderSnap.forEach(d => {
                const o = d.data();
                orderBox.innerHTML += `
                    <div class="border border-[#f0e4e2] p-3 rounded-xl text-xs space-y-1 bg-[#fbf8f7]">
                        <p class="font-bold text-gray-900">${o.name} - <span class="text-burgundy">${o.phone}</span></p>
                        <p class="text-gray-500">${o.address}</p>
                        <p class="text-gray-700"><strong>Items:</strong> ${o.items.map(i => i.title).join(', ')}</p>
                        <p class="text-burgundy font-bold">Total: ৳${o.total}</p>
                        <p class="text-[10px] text-gray-400">${o.date}</p>
                    </div>
                `;
            });

            // Products
            const prodBox = document.getElementById('products-list');
            prodBox.innerHTML = '<p class="text-xs text-gray-500">Loading products...</p>';
            const prodSnap = await getDocs(collection(db, "products"));
            prodBox.innerHTML = '';
            prodSnap.forEach(d => {
                const p = d.data();
                prodBox.innerHTML += `
                    <div class="flex items-center justify-between border border-[#f0e4e2] p-2.5 rounded-xl bg-[#fbf8f7] text-xs">
                        <div class="flex items-center gap-2.5">
                            <img src="${p.img}" class="w-10 h-10 object-cover rounded-lg bg-gray-100">
                            <div>
                                <p class="font-bold text-gray-800 line-clamp-1">${p.title}</p>
                                <p class="text-burgundy font-semibold">৳${p.price} | <span class="text-gray-400">${p.category}</span></p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${d.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        window.deleteProduct = async function(id) {
            if(confirm('Delete this product?')) {
                await deleteDoc(doc(db, "products", id));
                loadAllData();
            }
        };
    </script>
</body>
</html>
