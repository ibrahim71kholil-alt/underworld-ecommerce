<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Login View -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border">
            <div class="flex items-center justify-center gap-2 mb-6">
                <div class="w-8 h-8 bg-red-600 rounded flex items-center justify-center text-white"><i class="fas fa-crown"></i></div>
                <h2 class="text-2xl font-black">ADMIN ACCESS</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter Admin Password" required class="w-full border p-3 rounded-lg text-sm outline-none focus:border-black">
                <button type="submit" class="w-full bg-black hover:bg-zinc-800 text-white font-bold py-3 rounded-lg text-sm">Login to Dashboard</button>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-section" class="hidden min-h-screen">
        <!-- Header -->
        <header class="bg-black text-white py-4 px-6 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-shield-alt text-red-500"></i> Underworld Admin</h1>
            <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded font-bold">Logout</button>
        </header>

        <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Product Column -->
            <div class="bg-white p-5 rounded-xl border shadow-sm">
                <h3 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-plus-circle text-green-600"></i> Add New Product</h3>
                <form onsubmit="addProduct(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block font-semibold mb-1">Product Title</label>
                        <input type="text" id="p-title" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Price (৳)</label>
                        <input type="number" id="p-price" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Direct Image URL</label>
                        <input type="text" id="p-img" required class="w-full border p-2 rounded" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Category</label>
                        <select id="p-cat" class="w-full border p-2 rounded">
                            <option value="mens_fashion">Men's Fashion</option>
                            <option value="womans_fashion">Woman's Fashion</option>
                            <option value="smartwatch">Smartwatch</option>
                            <option value="gift_combo">Gift Combo</option>
                            <option value="shoes">Shoes</option>
                            <option value="airpods">Airpods</option>
                            <option value="power_bank">Power Bank</option>
                            <option value="electricity">Electricity</option>
                            <option value="phone">Phone</option>
                            <option value="skin_care">Skin Care</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded">Save Product</button>
                </form>
            </div>

            <!-- Customer Orders Column -->
            <div class="bg-white p-5 rounded-xl border shadow-sm">
                <h3 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-shopping-cart text-blue-600"></i> Customer Orders</h3>
                <div id="orders-list" class="space-y-3 max-h-[70vh] overflow-y-auto"></div>
            </div>

            <!-- Manage Products Column -->
            <div class="bg-white p-5 rounded-xl border shadow-sm">
                <h3 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-boxes text-purple-600"></i> Live Products</h3>
                <div id="products-list" class="space-y-3 max-h-[70vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 আপনার Firebase কনফিগারেশন কী বসান
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASS = "admin123"; // এডমিন পাসওয়ার্ড

        window.handleLogin = function(e) {
            e.preventDefault();
            if(document.getElementById('admin-pass').value === ADMIN_PASS) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadAllData();
            } else {
                alert('Invalid Admin Password!');
            }
        };

        window.logout = function() {
            location.reload();
        };

        window.addProduct = async function(e) {
            e.preventDefault();
            const product = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-cat').value
            };
            await addDoc(collection(db, "products"), product);
            alert('Product added successfully!');
            e.target.reset();
            loadAllData();
        };

        async function loadAllData() {
            // Load Orders
            const orderBox = document.getElementById('orders-list');
            orderBox.innerHTML = '<p class="text-xs text-gray-500">Loading orders...</p>';
            const orderSnap = await getDocs(collection(db, "orders"));
            orderBox.innerHTML = '';
            orderSnap.forEach(d => {
                const o = d.data();
                orderBox.innerHTML += `
                    <div class="border p-3 rounded-lg text-xs space-y-1 bg-gray-50">
                        <p class="font-bold text-sm">${o.name} - <span class="text-blue-600">${o.phone}</span></p>
                        <p class="text-gray-600">${o.address}</p>
                        <p><strong>Items:</strong> ${o.items.map(i => i.title).join(', ')}</p>
                        <p class="text-red-600 font-bold">Total: ৳${o.total}</p>
                        <p class="text-[10px] text-gray-400">${o.date}</p>
                    </div>
                `;
            });

            // Load Products
            const prodBox = document.getElementById('products-list');
            prodBox.innerHTML = '<p class="text-xs text-gray-500">Loading products...</p>';
            const prodSnap = await getDocs(collection(db, "products"));
            prodBox.innerHTML = '';
            prodSnap.forEach(d => {
                const p = d.data();
                prodBox.innerHTML += `
                    <div class="flex items-center justify-between border p-2 rounded-lg bg-gray-50 text-xs">
                        <div class="flex items-center gap-2">
                            <img src="${p.img}" class="w-10 h-10 object-cover rounded">
                            <div>
                                <p class="font-bold line-clamp-1">${p.title}</p>
                                <p class="text-red-600 font-semibold">৳${p.price} | <span class="text-gray-500">${p.category}</span></p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${d.id}')" class="text-red-500 hover:text-red-700 p-1"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        window.deleteProduct = async function(id) {
            if(confirm('Are you sure you want to delete this product?')) {
                await deleteDoc(doc(db, "products", id));
                loadAllData();
            }
        };
    </script>
</body>
</html>
