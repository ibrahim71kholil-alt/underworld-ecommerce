<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans">

    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-[#111827] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-800">
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="w-10 h-10 bg-gradient-to-tr from-red-600 to-rose-500 rounded-xl flex items-center justify-center text-white"><i class="fas fa-lock"></i></div>
                <h2 class="text-2xl font-black tracking-wide text-white">ADMIN ACCESS</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter Admin Password" required class="w-full bg-[#1e293b] border border-gray-700 p-3.5 rounded-xl text-sm text-white outline-none focus:border-red-500">
                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-xl text-sm transition">Login to Panel</button>
            </form>
        </div>
    </div>

    <div id="dashboard-section" class="hidden min-h-screen">
        <header class="bg-[#111827] border-b border-gray-800 py-4 px-6 flex justify-between items-center">
            <h1 class="text-xl font-black flex items-center gap-2 text-white"><i class="fas fa-shield-alt text-red-500"></i> Underworld Dashboard</h1>
            <button onclick="logout()" class="text-xs bg-gray-800 hover:bg-red-600 px-4 py-2 rounded-lg font-bold transition">Logout</button>
        </header>

        <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-[#111827] p-5 rounded-2xl border border-gray-800 shadow-lg">
                <h3 class="text-base font-bold mb-4 border-b border-gray-800 pb-2 text-white"><i class="fas fa-plus-circle text-green-500"></i> Add New Product</h3>
                <form onsubmit="addProduct(event)" class="space-y-3.5 text-sm">
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1 text-xs">Product Title</label>
                        <input type="text" id="p-title" required class="w-full bg-[#1e293b] border border-gray-700 p-2.5 rounded-xl text-white outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1 text-xs">Price (৳)</label>
                        <input type="number" id="p-price" required class="w-full bg-[#1e293b] border border-gray-700 p-2.5 rounded-xl text-white outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1 text-xs">Direct Image URL</label>
                        <input type="text" id="p-img" required class="w-full bg-[#1e293b] border border-gray-700 p-2.5 rounded-xl text-white outline-none focus:border-red-500" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1 text-xs">Category</label>
                        <select id="p-cat" class="w-full bg-[#1e293b] border border-gray-700 p-2.5 rounded-xl text-white outline-none focus:border-red-500">
                            <option value="mens_fashion">Men's fashion</option>
                            <option value="womans_fashion">Woman's fashion</option>
                            <option value="smartwatch">Smartwatch</option>
                            <option value="gift_combo">Gift combo</option>
                            <option value="shoes">Shoes</option>
                            <option value="airpods">Airpods</option>
                            <option value="power_bank">Power bank</option>
                            <option value="electricity">Electricity</option>
                            <option value="phone">Phone</option>
                            <option value="skin_care">Skin care</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition">Save Product</button>
                </form>
            </div>

            <div class="bg-[#111827] p-5 rounded-2xl border border-gray-800 shadow-lg">
                <h3 class="text-base font-bold mb-4 border-b border-gray-800 pb-2 text-white"><i class="fas fa-shopping-cart text-blue-500"></i> Customer Orders</h3>
                <div id="orders-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1"></div>
            </div>

            <div class="bg-[#111827] p-5 rounded-2xl border border-gray-800 shadow-lg">
                <h3 class="text-base font-bold mb-4 border-b border-gray-800 pb-2 text-white"><i class="fas fa-boxes text-purple-500"></i> Live Products</h3>
                <div id="products-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASS = "admin123";

        window.handleLogin = function(e) {
            e.preventDefault();
            if(document.getElementById('admin-pass').value === ADMIN_PASS) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadAllData();
            } else {
                alert('Invalid Admin Password!');
            }
        };

        window.logout = () => location.reload();

        window.addProduct = async function(e) {
            e.preventDefault();
            const product = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-cat').value
            };
            await addDoc(collection(db, "products"), product);
            alert('Product added successfully!');
            e.target.reset();
            loadAllData();
        };

        async function loadAllData() {
            const orderBox = document.getElementById('orders-list');
            orderBox.innerHTML = '<p class="text-xs text-gray-500">Loading orders...</p>';
            const orderSnap = await getDocs(collection(db, "orders"));
            orderBox.innerHTML = '';
            orderSnap.forEach(d => {
                const o = d.data();
                orderBox.innerHTML += `
                    <div class="border border-gray-800 p-3.5 rounded-xl text-xs space-y-1.5 bg-[#1e293b]/60">
                        <p class="font-bold text-sm text-white">${o.name} - <span class="text-red-400">${o.phone}</span></p>
                        <p class="text-gray-400">${o.address}</p>
                        <p class="text-gray-300"><strong>Items:</strong> ${o.items.map(i => i.title).join(', ')}</p>
                        <p class="text-rose-400 font-bold">Total: ৳${o.total}</p>
                        <p class="text-[10px] text-gray-500">${o.date}</p>
                    </div>
                `;
            });

            const prodBox = document.getElementById('products-list');
            prodBox.innerHTML = '<p class="text-xs text-gray-500">Loading products...</p>';
            const prodSnap = await getDocs(collection(db, "products"));
            prodBox.innerHTML = '';
            prodSnap.forEach(d => {
                const p = d.data();
                prodBox.innerHTML += `
                    <div class="flex items-center justify-between border border-gray-800 p-2.5 rounded-xl bg-[#1e293b]/60 text-xs">
                        <div class="flex items-center gap-2.5">
                            <img src="${p.img}" class="w-10 h-10 object-cover rounded-lg bg-gray-900">
                            <div>
                                <p class="font-bold text-gray-200 line-clamp-1">${p.title}</p>
                                <p class="text-red-400 font-semibold">৳${p.price} | <span class="text-gray-400">${p.category}</span></p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${d.id}')" class="text-red-400 hover:text-red-300 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        window.deleteProduct = async function(id) {
            if(confirm('Delete this product?')) {
                await deleteDoc(doc(db, "products", id));
                loadAllData();
            }
        };
    </script>
</body>
</html>
